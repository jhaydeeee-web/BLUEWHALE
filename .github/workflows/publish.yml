name: Publish to NPM
on:
  push:
    tags:
      - 'v*'
  # Dry-run the publish on PRs that touch the published packages or this
  # workflow, so a broken manifest or build is caught before a release tag.
  pull_request:
    paths:
      - 'packages/core-ts/**'
      - 'packages/bluewhale/**'
      - '.github/workflows/publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install

      # bluewhale depends on bluewhale-core, so core must be built first.
      - run: pnpm --filter @redishfish/bluewhale-core build

      - run: pnpm --filter @redishfish/bluewhale build

      - name: Verify @redishfish/bluewhale build output
        run: |
          test -f packages/bluewhale/dist/index.js
          test -f packages/bluewhale/dist/index.d.ts

      - name: Dry-run publish
        run: |
          pnpm --filter @redishfish/bluewhale-core publish --dry-run --no-git-checks --access public
          pnpm --filter @redishfish/bluewhale publish --dry-run --no-git-checks --access public

      - name: Publish @redishfish/bluewhale-core to NPM
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter @redishfish/bluewhale-core publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @redishfish/bluewhale to NPM
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm --filter @redishfish/bluewhale publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
