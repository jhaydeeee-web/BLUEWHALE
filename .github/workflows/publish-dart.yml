name: Publish to pub.dev

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish bluewhale_core to pub.dev
    runs-on: ubuntu-latest
    # pub.dev publishing requires id-token for OIDC authentication
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/core-dart
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify package (dry run)
        run: dart pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force
