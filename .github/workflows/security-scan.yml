name: Security Scan

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/core-go/go.mod'
      - 'packages/core-go/go.sum'
      - 'examples/prism-core/Cargo.toml'
      - 'examples/rust-address-fuzzer/Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-npm:
    name: npm audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high

  audit-go:
    name: govulncheck (core-go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        working-directory: packages/core-go

  audit-rust-prism:
    name: cargo audit (prism-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
        working-directory: examples/prism-core

  audit-rust-fuzzer:
    name: cargo audit (rust-address-fuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
        working-directory: examples/rust-address-fuzzer

  security-gate:
    name: security gate
    runs-on: ubuntu-latest
    needs: [audit-npm, audit-go, audit-rust-prism, audit-rust-fuzzer]
    if: always()
    steps:
      - name: Enforce all audits passed
        if: >
          needs.audit-npm.result != 'success' ||
          needs.audit-go.result != 'success' ||
          needs.audit-rust-prism.result != 'success' ||
          needs.audit-rust-fuzzer.result != 'success'
        run: |
          echo "::error::Security scan failed — at least one audit found vulnerabilities."
          echo "::error::npm audit:          ${{ needs.audit-npm.result }}"
          echo "::error::govulncheck go:     ${{ needs.audit-go.result }}"
          echo "::error::cargo audit prism:  ${{ needs.audit-rust-prism.result }}"
          echo "::error::cargo audit fuzzer: ${{ needs.audit-rust-fuzzer.result }}"
          exit 1
