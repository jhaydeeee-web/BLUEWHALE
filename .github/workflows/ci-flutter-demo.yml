name: ci-flutter-demo

on:
  pull_request:
    paths:
      - "examples/flutter-demo/**"
      - "packages/core-dart/**"
      - ".github/workflows/ci-flutter-demo.yml"

concurrency:
  group: ci-flutter-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Flutter Demo – analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/flutter-demo

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test
